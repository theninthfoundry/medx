name: Build & Deploy MEDX

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Executable JAR with Maven
        run: mvn -B clean package --file pom.xml

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEDX-executable-jar
          path: target/MEDX.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MEDX Latest Release"
          body: |
            ## MEDX — Hospital Records System
            Automated build from commit `${{ github.sha }}`.

            ### How to Run
            1. Download `MEDX.jar` below.
            2. Run with Java 17+:
               ```bash
               java -jar MEDX.jar
               ```
          files: target/MEDX.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
